<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengerjaan Ujian Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .selected-opt { border-color: #2563eb; background-color: #eff6ff; }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <!-- ================= 1. HALAMAN LOGIN SISWA ================= -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold mb-2 text-center text-slate-800" id="examTitleLogin">Konfirmasi Ujian</h2>
      <p class="text-sm text-slate-500 mb-6 text-center">Masukkan NIS Anda untuk memulai pengerjaan.</p>
      
      <div class="mb-4">
        <label class="block font-semibold mb-1 text-sm">Nomor Induk Siswa (NIS)</label>
        <input type="text" id="nisInput" placeholder="Contoh: 20261001" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button onclick="startExam()" id="btnStart" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
        Mulai Ujian
      </button>
    </div>
  </div>

  <!-- ================= 2. HALAMAN PENGERJAAN UJIAN ================= -->
  <div id="examSection" class="hidden min-h-screen flex flex-col">
    <!-- Header / Navbar -->
    <header class="bg-white border-b px-6 py-4 sticky top-0 z-10 flex justify-between items-center shadow-sm">
      <div>
        <h1 id="examTitleHeader" class="font-bold text-lg text-slate-800">Nama Ujian</h1>
        <p id="studentInfo" class="text-xs text-slate-500">Siswa: - | NIS: -</p>
      </div>
      <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-lg font-mono font-bold text-lg" id="timerBox">
        00:00:00
      </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
      
      <!-- Box Soal & Opsi -->
      <div class="md:col-span-3 bg-white p-6 rounded-xl shadow space-y-6 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center border-b pb-3 mb-4">
            <span class="font-bold text-slate-600">Soal No. <span id="currentQuestionNum">1</span></span>
          </div>

          <!-- Teks & Gambar Soal -->
          <div class="space-y-4">
            <div id="questionText" class="text-base md:text-lg font-medium leading-relaxed"></div>
            <div id="questionImageContainer" class="hidden">
              <img id="questionImage" src="" class="max-h-64 object-contain rounded border">
            </div>
          </div>

          <!-- Opsi Jawaban (A-E) -->
          <div class="mt-6 space-y-3" id="optionsContainer"></div>
        </div>

        <!-- Tombol Navigasi Soal -->
        <div class="flex justify-between items-center border-t pt-4 mt-6">
          <button id="btnPrev" onclick="navigateQuestion(-1)" class="px-4 py-2 bg-slate-200 rounded-lg hover:bg-slate-300 font-semibold text-sm">
            &larr; Sebelumnya
          </button>
          <button id="btnNext" onclick="navigateQuestion(1)" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold text-sm">
            Selanjutnya &rarr;
          </button>
        </div>
      </div>

      <!-- Sidebar Navigasi Nomor Soal -->
      <div class="bg-white p-6 rounded-xl shadow space-y-4 h-fit">
        <h3 class="font-bold text-slate-700 border-b pb-2">Navigasi Soal</h3>
        <div id="numberGrid" class="grid grid-cols-5 gap-2"></div>
        
        <button onclick="confirmSubmit()" id="btnSubmit" class="w-full mt-6 bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition">
          Selesaikan Ujian
        </button>
      </div>

    </div>
  </div>

  <!-- Script Logika Client-side -->
  <script>
    // GANTI DENGAN URL GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxv04CGYndnIapm0PaVElRzGSre-Q3TJaoeiHIE7wBgb_LcVVkgQbFUtyHOiXb1fnHt/exec";

    let examData = null;
    let studentData = null;
    let questions = [];
    let userAnswers = {}; // Map: questionId -> labelJawaban (A, B, C, D, E)
    let currentIdx = 0;
    let timerInterval = null;
    let remainingTime = 0;

    // Membaca Parameter 'sheetId' dari URL (?sheetId=xxx)
    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get('sheetId');

    // On Load: Tarik metadata pengerjaan berdasarkan Spreadsheet khusus
    window.onload = async () => {
      if (!sheetId) {
        alert("Link Ujian tidak valid! ID Spreadsheet tidak ditemukan.");
        return;
      }
      fetchExamData();
    };

    async function fetchExamData() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getUjian&sheetId=${sheetId}`);
        const data = await res.json();
        
        if (data.status === "success") {
          examData = data;
          document.getElementById('examTitleLogin').innerText = data.namaUjian;
          document.getElementById('examTitleHeader').innerText = data.namaUjian;
        } else {
          alert(data.message || "Data ujian tidak ditemukan.");
        }
      } catch (err) {
        alert("Gagal memuat data ujian.");
      }
    }

    async function startExam() {
      const nis = document.getElementById('nisInput').value.trim();
      if (!nis) return alert("Harap masukkan NIS!");

      document.getElementById('btnStart').innerText = "Memeriksa...";
      document.getElementById('btnStart').disabled = true;

      try {
        // Validasi Siswa ke Backend khusus Spreadsheet ini
        const res = await fetch(`${SCRIPT_URL}?action=validateSiswa&sheetId=${sheetId}&nis=${nis}`);
        const data = await res.json();

        if (data.status !== "success") {
          alert(data.message || "NIS tidak terdaftar untuk ujian ini!");
          return;
        }

        studentData = data.siswa;
        questions = data.soal;

        // Fitur Acak Soal jika Diaktifkan
        if (examData.acakSoal) {
          questions = shuffleArray(questions);
        }

        // Fitur Acak Opsi Jawaban jika Diaktifkan
        if (examData.acakJawaban) {
          questions.forEach(q => {
            q.options = shuffleArray(q.options);
          });
        }

        // UI Switch
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('examSection').classList.remove('hidden');
        document.getElementById('studentInfo').innerText = `Siswa: ${studentData.nama_siswa} | NIS: ${studentData.nis}`;

        // Inisialisasi Timer & Grid Navigasi
        remainingTime = parseInt(examData.durasi) * 60;
        startTimer();
        renderNumberGrid();
        renderQuestion(0);
      } catch (err) {
        alert("Gagal terhubung ke server.");
      } finally {
        document.getElementById('btnStart').innerText = "Mulai Ujian";
        document.getElementById('btnStart').disabled = false;
      }
    }

    function renderQuestion(idx) {
      currentIdx = idx;
      const q = questions[idx];

      document.getElementById('currentQuestionNum').innerText = idx + 1;
      document.getElementById('questionText').innerText = q.pertanyaan;

      // Render Gambar Soal jika Ada
      const imgBox = document.getElementById('questionImageContainer');
      const imgEl = document.getElementById('questionImage');
      if (q.urlGambarSoal) {
        imgEl.src = q.urlGambarSoal;
        imgBox.classList.remove('hidden');
      } else {
        imgBox.classList.add('hidden');
      }

      // Render Opsi Jawaban (A-E)
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt) => {
        const isSelected = userAnswers[q.id_soal] === opt.labelOriginal;
        
        const optDiv = document.createElement('div');
        optDiv.className = `p-4 border rounded-lg cursor-pointer flex items-center space-x-3 transition ${isSelected ? 'selected-opt border-blue-600' : 'hover:bg-slate-50'}`;
        optDiv.onclick = () => selectOption(q.id_soal, opt.labelOriginal);

        let imgHtml = opt.gambar ? `<img src="${opt.gambar}" class="h-16 object-contain rounded border my-1">` : '';

        optDiv.innerHTML = `
          <div class="w-6 h-6 flex items-center justify-center border rounded-full font-bold text-sm ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200'}">
            ${opt.displayLabel}
          </div>
          <div class="flex-1">
            <p class="text-sm md:text-base">${opt.teks}</p>
            ${imgHtml}
          </div>
        `;
        container.appendChild(optDiv);
      });

      // Kontrol Tombol Next/Prev
      document.getElementById('btnPrev').disabled = idx === 0;
      document.getElementById('btnNext').disabled = idx === questions.length - 1;
      
      updateGridHighlights();
    }

    function selectOption(qId, labelOriginal) {
      userAnswers[qId] = labelOriginal;
      renderQuestion(currentIdx);
    }

    function navigateQuestion(step) {
      const nextIdx = currentIdx + step;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        renderQuestion(nextIdx);
      }
    }

    function renderNumberGrid() {
      const grid = document.getElementById('numberGrid');
      grid.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.className = `p-2 rounded font-semibold text-sm border hover:bg-slate-100`;
        btn.onclick = () => renderQuestion(idx);
        grid.appendChild(btn);
      });
    }

    function updateGridHighlights() {
      questions.forEach((q, idx) => {
        const btn = document.getElementById(`grid-btn-${idx}`);
        const isAnswered = !!userAnswers[q.id_soal];
        const isCurrent = idx === currentIdx;

        btn.className = `p-2 rounded font-semibold text-sm border transition `;
        if (isCurrent) {
          btn.className += `ring-2 ring-blue-600 `;
        }
        if (isAnswered) {
          btn.className += `bg-green-500 text-white border-green-600`;
        } else {
          btn.className += `bg-slate-100 text-slate-700`;
        }
      });
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        remainingTime--;
        
        const hours = Math.floor(remainingTime / 3600);
        const minutes = Math.floor((remainingTime % 3600) / 60);
        const seconds = remainingTime % 60;

        document.getElementById('timerBox').innerText = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          alert("Waktu Ujian Telah Habis!");
          submitExam();
        }
      }, 1000);
    }

    function confirmSubmit() {
      const answeredCount = Object.keys(userAnswers).length;
      if (confirm(`Anda telah menjawab ${answeredCount} dari ${questions.length} soal. Yakin ingin mengumpulkan?`)) {
        submitExam();
      }
    }

    async function submitExam() {
      clearInterval(timerInterval);
      
      document.getElementById('btnSubmit').innerText = "Mengirim...";
      document.getElementById('btnSubmit').disabled = true;

      const payload = {
        action: "submitJawaban",
        sheetId: sheetId,
        nis: studentData.nis,
        nama: studentData.nama_siswa,
        jawaban: userAnswers
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "success") {
          alert(`Ujian berhasil dikumpulkan!\nNilai Anda: ${data.nilaiAkhir}`);
          window.location.reload();
        } else {
          alert(data.message || "Gagal menyimpan jawaban.");
        }
      } catch (err) {
        alert("Koneksi gagal saat mengumpulkan jawaban.");
      }
    }

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
